# 서버 배포 구성.
#
#   cd ~/ktc4-pusan-1/deploy
#   docker compose up -d
#
# 같은 디렉터리의 `.env` 를 compose 가 자동으로 읽습니다.
# `.env` 는 커밋되지 않습니다 (.gitignore).

name: irya

services:
  caddy:
    image: caddy:2.10
    container_name: irya-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/ubuntu/fe:/site:ro
      # 인증서 저장소. 빼면 재기동마다 새로 발급받아 Let's Encrypt 한도를 소진합니다.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
