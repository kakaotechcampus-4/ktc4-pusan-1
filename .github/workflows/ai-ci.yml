name: AI CI

on:
  pull_request:
    # 스택 PR 은 base 가 develop 이 아니라 앞선 feature 브랜치다. develop 만 걸면
    # 그런 PR 에는 검사가 아예 안 돌아 무검증으로 리뷰에 올라간다 — 실제로 PR #94 가
    # 그랬다. push 쪽은 develop 만 둔다. feature 브랜치마다 돌리면 PR 하나에 검사가
    # 두 번씩 돈다.
    #
    # ⭐ pull_request 에는 paths 를 걸지 않는다. 이 검사는 develop 의 필수 상태 검사라,
    #   트리거에서 거르면 ai/ 를 안 건드린 PR 에는 검사가 아예 안 생겨 머지가
    #   영영 막힌다. 대신 잡은 늘 돌고, 첫 단계에서 바뀐 경로를 보고 나머지를 건너뛴다.
    #   건너뛴 단계는 성공으로 보고된다.
    branches: [develop, "feature/**", "fix/**", "chore/**", "refactor/**", "perf/**"]
  push:
    branches: [develop]
    paths:
      - "ai/**"
      - ".github/workflows/ai-ci.yml"

permissions:
  contents: read
  pull-requests: read # 변경 경로 확인 (dorny/paths-filter)

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Detect ai changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            run:
              - "ai/**"
              - ".github/workflows/ai-ci.yml"

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          working-directory: ai

      - name: Install Python
        if: steps.changes.outputs.run == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check .

      - name: Check formatting
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff format --check .

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest
