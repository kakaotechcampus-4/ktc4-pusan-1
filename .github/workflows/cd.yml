name: CD

# develop 에 반영된 것을 서버에 올린다.
#
# pull_request 트리거는 넣지 않는다 — PR 을 열 때마다 배포되면 안 되고,
# 배포 역할(ktc-github-deploy)의 신뢰 정책이 브랜치를 가리지 않아
# (`repo:kakaotechcampus-4/ktc4-pusan-1:*`) 워크플로 쪽에서 좁혀야 한다.
on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ai/**"
      - "infra/**"
      - ".github/workflows/cd.yml"
  # 첫 실행과 롤백용. 기본 브랜치가 develop 이라 Actions 탭에 버튼이 뜬다.
  #
  # 브랜치만 받는다. deploy.sh 가 `origin/<ref>` 로 체크아웃하는데, 원격 추적
  # ref(`refs/remotes/origin/*`)는 브랜치를 fetch 할 때만 생긴다. 태그도 커밋
  # SHA 도 FETCH_HEAD 에만 기록되므로 `origin/<ref>` 가 풀리지 않는다.
  # 롤백은 되돌릴 커밋을 브랜치로 push 한 뒤 그 이름을 넣는다.
  #
  # ⚠️ 이 PR 이전 커밋으로는 롤백이 되지 않는다. 아래 SSM 명령이 **배포할 ref
  #    에서** deploy.sh 를 꺼내 /tmp 에서 돌리는데, 옛 스크립트는 경로를
  #    BASH_SOURCE 로만 잡아 REPO=/ 가 되고 git fetch 에서 죽는다.
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 ref (브랜치만 — origin/<ref> 로 체크아웃한다)"
        required: false
        default: develop

# 기본값이 read 다. id-token 은 레포 설정으로 못 켜고 여기 적어야 한다 —
# 안 적으면 러너가 토큰 요청 URL 자체를 주입하지 않는다.
permissions:
  contents: read
  id-token: write

# 배포가 겹치면 서버에서 git·docker 가 동시에 돈다. 취소하지 않고 줄 세운다 —
# 배포 도중에 죽이면 컨테이너가 어중간한 상태로 남는다.
concurrency:
  group: cd-server
  cancel-in-progress: false

env:
  # FE 빌드를 CI 와 서버 사이에 넘기는 자리 (#103). infra/deploy.sh 도 같은 값을 쓴다.
  FE_BUCKET: ktc4-pusan-1-irya

jobs:
  # FE 는 서버가 아니라 여기서 빌드한다 — 서버에는 node 가 없고, 서버 빌드는
  # 진행 중인 면접과 CPU(vCPU 2)를 나눠 쓴다. 결과는 S3 fe/<FRONTEND_SHA>/ 에
  # 두고 deploy.sh 가 같은 SHA 를 계산해 받아 간다.
  build-fe:
    name: Build FE to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # FRONTEND_SHA 를 서버의 deploy.sh 와 같은 방식(frontend/ 를 마지막으로
          # 바꾼 커밋)으로 구하려면 이력이 있어야 한다.
          fetch-depth: 0

      - name: FRONTEND_SHA
        id: sha
        run: echo "sha=$(git log -1 --format=%H -- frontend)" >> "$GITHUB_OUTPUT"

      - name: AWS 자격 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # version.json 은 업로드의 마지막 파일이라, 있으면 그 SHA 는 다 올라간 것이다.
      # 같은 SHA 는 다시 빌드하지도 덮어쓰지도 않는다 (BE · AI 만 바뀐 머지).
      - name: 이미 올라간 SHA 인지
        id: cached
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if aws s3api head-object --bucket "$FE_BUCKET" --key "fe/$SHA/version.json" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "fe/$SHA 가 이미 있어 빌드를 건너뜁니다."
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7.0.0
        if: steps.cached.outputs.hit != 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 빌드
        if: steps.cached.outputs.hit != 'true'
        working-directory: frontend
        env:
          # 번들에 실려 브라우저로 가는 공개값이라 Secret 이 아니라 Variable 이다.
          # API 주소와 Redirect URI 는 비워 같은 오리진 기본값을 탄다.
          VITE_KAKAO_CLIENT_ID: ${{ vars.KAKAO_CLIENT_ID }}
          VITE_USE_MOCK_API: "false"
        run: |
          npm ci
          npm run build

      # 10/3 수동 배포 때 쓴 검사다. 하나라도 어긋나면 운영 화면이 깨진 채로 나간다.
      - name: 빌드 검사
        if: steps.cached.outputs.hit != 'true'
        working-directory: frontend/dist
        env:
          KAKAO_CLIENT_ID: ${{ vars.KAKAO_CLIENT_ID }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          [ -n "$KAKAO_CLIENT_ID" ] || { echo "레포 Variable KAKAO_CLIENT_ID 가 비어 있습니다"; exit 1; }
          grep -rqF "$KAKAO_CLIENT_ID" assets || { echo "번들에 카카오 client ID 가 없습니다"; exit 1; }
          if grep -rqF "localhost:8000" .; then echo "번들에 localhost:8000 이 남았습니다"; exit 1; fi
          missing=$(grep -oE '(src|href)="/[^"]+"' index.html | sed -E 's/^[a-z]+="\///; s/"$//' \
            | while read -r f; do [ -f "$f" ] || echo "$f"; done)
          [ -z "$missing" ] || { echo "index.html 이 가리키는 파일이 없습니다:"; echo "$missing"; exit 1; }
          printf '{"commit":"%s","builtAt":"%s","mock":false,"node":"%s"}\n' \
            "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(node -v | tr -d v)" > version.json

      - name: S3 업로드
        if: steps.cached.outputs.hit != 'true'
        working-directory: frontend/dist
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # version.json 을 마지막에 올린다. 중간에 끊긴 업로드를 완료로 보지 않게.
          aws s3 cp . "s3://$FE_BUCKET/fe/$SHA/" --recursive --exclude version.json --only-show-errors
          aws s3 cp version.json "s3://$FE_BUCKET/fe/$SHA/version.json" --only-show-errors
          echo "올림: s3://$FE_BUCKET/fe/$SHA/"

  deploy:
    name: Deploy to EC2
    needs: build-fe
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: AWS 자격 획득 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 계정 ID·인스턴스 ID 는 public 레포라 시크릿으로 둔다.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: SSM 으로 배포 실행
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REF: ${{ github.event.inputs.ref || 'develop' }}
        run: |
          set -euo pipefail

          # 22번 포트를 열지 않으므로 SSH 가 아니라 SSM 으로 넣는다.
          # SSM 은 root 로 실행한다. 레포와 docker 는 ubuntu 소유라 넘겨준다.
          #
          # 레포 안의 deploy.sh 를 직접 부르지 않고, 배포할 ref 에서 꺼내
          # /tmp 에 쓴 뒤 그 파일을 돌린다. 이유가 둘이다.
          #   - 서버에 파일이 없으면 CD 가 통째로 죽는다. 첫 실행이
          #     `No such file or directory` (exit 127) 로 끝났다. 스크립트를
          #     서버에 가져다주는 게 그 스크립트 자신이라 서로를 기다렸다.
          #   - 스크립트 안의 checkout 이 레포의 deploy.sh 를 갈아끼운다.
          #     실행 중인 파일이 바뀌면 bash 가 남은 줄을 엉뚱하게 읽는다.
          #
          # ⚠️ **파이프(`| bash -s`)로 넣으면 안 된다.** 스크립트 안에서
          #    stdin 을 읽는 명령(`docker compose exec` 등)이 파이프에 남은
          #    스크립트를 통째로 먹어서, 그 아래 줄이 전부 실행되지 않고 bash 가
          #    EOF 로 exit 0 을 낸다. 헬스 체크가 건너뛰어진 채 CD 가 성공으로
          #    보고된다. 재현 확인함.
          #
          # /tmp 에 고정 이름을 쓴다. 위 `concurrency: cd-server` 가 배포를
          # 직렬화하므로 겹치지 않는다.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"sudo -u ubuntu bash -lc 'cd ~/ktc4-pusan-1 && git fetch --quiet origin $REF && git show origin/$REF:infra/deploy.sh > /tmp/irya-deploy.sh && bash /tmp/irya-deploy.sh $REF'\"],executionTimeout=[\"900\"]" \
            --query 'Command.CommandId' --output text)

          echo "CommandId: $CMD_ID"

          # send-command 는 비동기다. 폴링하지 않으면 서버가 실패해도
          # 워크플로는 초록불이 된다.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "::group::서버 출력"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "::endgroup::"

          ERR=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "::group::stderr"
            echo "$ERR"
            echo "::endgroup::"
          fi

          # 실행 요약 페이지에 렌더링한다. 원격 실행이라 스텝을 쪼갤 수 없어
          # (SSM 명령마다 셸이 새로 뜬다) 로그를 열지 않고도 결과가 보이게 한다.
          {
            echo "## 배포 결과"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 결과 | \`$STATUS\` |"
            echo "| ref | \`$REF\` |"
            echo "| 커밋 | [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo
            echo '<details><summary>서버 출력</summary>'
            echo
            echo '```'
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' --output text 2>/dev/null | tail -60 || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: 외부에서 확인
        env:
          FRONTEND_SHA: ${{ needs.build-fe.outputs.sha }}
        run: |
          set -euo pipefail
          # deploy.sh 가 서버 안에서 이미 확인했지만, 여기서는 인터넷을 거쳐
          # 본다 — Caddy·TLS·DNS 까지 지나야 실제 사용자와 같은 경로다.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://irya.cloud/health)
          echo "https://irya.cloud/health → $code"
          [ "$code" = "200" ]

          # deploy.sh 는 S3 에 빌드가 없으면 경고만 하고 지금 화면을 둔다 (손으로
          # 돌린 배포를 위해서다). CD 에서는 build-fe 가 올려 두었으니 여기서 맞춘다.
          fe=$(curl -s --max-time 10 https://irya.cloud/version.json)
          echo "https://irya.cloud/version.json → $fe"
          case "$fe" in
            *"\"$FRONTEND_SHA\""*) ;;
            *) echo "운영 FE 가 $FRONTEND_SHA 가 아닙니다"; exit 1 ;;
          esac
