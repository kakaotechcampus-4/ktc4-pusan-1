name: BE CI

on:
  pull_request:
    # 스택 PR 은 base 가 develop 이 아니라 앞선 feature 브랜치다. develop 만 걸면
    # 그런 PR 에는 검사가 아예 안 돌아 무검증으로 리뷰에 올라간다 — 실제로 PR #94 가
    # 그랬다. push 쪽은 develop 만 둔다. feature 브랜치마다 돌리면 PR 하나에 검사가
    # 두 번씩 돈다.
    #
    # ⭐ pull_request 에는 paths 를 걸지 않는다. 이 검사는 develop 의 필수 상태 검사라,
    #   트리거에서 거르면 backend/ 를 안 건드린 PR 에는 검사가 아예 안 생겨 머지가
    #   영영 막힌다. 대신 잡은 늘 돌고, 첫 단계에서 바뀐 경로를 보고 나머지를 건너뛴다.
    #   건너뛴 단계는 성공으로 보고된다.
    branches: [develop, "feature/**", "fix/**", "chore/**", "refactor/**", "perf/**"]
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/be-ci.yml"

permissions:
  contents: read
  pull-requests: read # 변경 경로 확인 (dorny/paths-filter)

concurrency:
  group: be-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            run:
              - "backend/**"
              - ".github/workflows/be-ci.yml"

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          working-directory: backend

      - name: Install Python
        if: steps.changes.outputs.run == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check .

      - name: Check formatting
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff format --check .

      - name: Type check
        if: steps.changes.outputs.run == 'true'
        run: uv run pyright

      # 녹화 합치기 테스트가 ffmpeg 를 직접 돌린다. 없으면 건너뛰어 CI 에서는
      # 합치기와 그 S3 클라이언트 검사(#183)가 한 번도 돌지 않는다.
      - name: Install ffmpeg
        if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest

      # API 가 바뀌었는데 스키마 파일을 안 올리면 여기서 걸린다.
      # FE·AI 가 이 파일을 계약으로 보므로 코드와 어긋나면 안 된다.
      - name: Check OpenAPI schema is committed
        if: steps.changes.outputs.run == 'true'
        run: |
          uv run python -m scripts.dump_openapi
          git diff --exit-code ../docs/api/openapi.json
