name: BE CI

on:
  pull_request:
    # 스택 PR 은 base 가 develop 이 아니라 앞선 feature 브랜치다. develop 만 걸면
    # 그런 PR 에는 검사가 아예 안 돌아 무검증으로 리뷰에 올라간다 — 실제로 PR #94 가
    # 그랬다. push 쪽은 develop 만 둔다. feature 브랜치마다 돌리면 PR 하나에 검사가
    # 두 번씩 돈다.
    branches: [develop, "feature/**", "fix/**", "chore/**", "refactor/**", "perf/**"]
    paths:
      - "backend/**"
      - ".github/workflows/be-ci.yml"
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/be-ci.yml"

permissions:
  contents: read

concurrency:
  group: be-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 저장소 계약 테스트(`tests/test_store_contract.py`)의 PostgreSQL 쪽은
    # TEST_DATABASE_URL 이 없으면 건너뛴다. 여기서 DB 를 띄우지 않으면 PG 구현은
    # CI 에서 한 번도 검사되지 않는다. 버전은 그 파일 docstring 과 맞춘다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: irya
          POSTGRES_PASSWORD: test
          POSTGRES_DB: irya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irya -d irya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          working-directory: backend

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # 녹화 합치기 테스트가 ffmpeg 를 직접 돌린다. 없으면 건너뛰어 CI 에서는
      # 합치기와 그 S3 클라이언트 검사(#183)가 한 번도 돌지 않는다.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: uv run pytest -rs
        env:
          TEST_DATABASE_URL: postgresql://irya:test@localhost:5432/irya

      # API 가 바뀌었는데 스키마 파일을 안 올리면 여기서 걸린다.
      # FE·AI 가 이 파일을 계약으로 보므로 코드와 어긋나면 안 된다.
      - name: Check OpenAPI schema is committed
        run: |
          uv run python -m scripts.dump_openapi
          git diff --exit-code ../docs/api/openapi.json
