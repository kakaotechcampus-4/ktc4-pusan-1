name: FE CI

on:
  pull_request:
    # 스택 PR 은 base 가 develop 이 아니라 앞선 feature 브랜치다. develop 만 걸면
    # 그런 PR 에는 검사가 아예 안 돌아 무검증으로 리뷰에 올라간다 — 실제로 PR #94 가
    # 그랬다. push 쪽은 develop 만 둔다. feature 브랜치마다 돌리면 PR 하나에 검사가
    # 두 번씩 돈다.
    branches: [develop, "feature/**", "fix/**", "chore/**", "refactor/**", "perf/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/fe-ci.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/fe-ci.yml"

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test transcript frames
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 브라우저 E2E (#329). 빌드 결과를 vite preview 로 띄워 Chromium 으로 화면 흐름을
      # 본다. 로그인 뒤 화면의 /api 는 e2e/mockApi.ts 에서 모킹한다 — 테스트용 인증 우회는
      # 만들지 않는다. 브라우저는 package-lock 의 @playwright/test 버전에 맞는 것을 받는다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
